name: kifu-kouza-2026
services:
  web:
    image: nginx:1.28-alpine
    container_name: kifu-kouza-2026-web
    restart: unless-stopped
    ports:
      - "192.168.1.64:3110:80"
    volumes:
      - ../web/public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
