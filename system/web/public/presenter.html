<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>講師画面｜技術者と社会</title><link rel="stylesheet" href="presenter.css?v=20261015d"></head><body>
<header><div><strong>講師画面</strong><span id="connection">投影画面に接続中</span></div><div><button id="audience">投影画面を開く</button><button id="timer">開始 00:00</button><button id="reset">時間をリセット</button></div></header>
<main><section class="script"><div class="meta"><span id="part"></span><span id="timing"></span></div><h1 id="title"></h1><div class="text-size"><button id="smaller">文字 −</button><button id="larger">文字 ＋</button><span>左右キーでページ送り / ホイールでセリフをスクロール</span></div><div id="speech" tabindex="0" aria-label="話す内容"></div><details><summary>出典・画像の情報</summary><div id="sources"></div></details></section><aside><div class="preview-label">現在の投影画面</div><iframe id="preview" title="現在のスライド" tabindex="-1"></iframe><div class="preview-label">次のページ</div><h2 id="next-title"></h2><p id="next-lead"></p><label for="jump">ページへ移動</label><select id="jump"></select><p class="help">このウィンドウを手元の画面へ移動し、投影画面をプロジェクター側へ移動してください。投影画面の F キーで全画面、Escで操作バーを表示できます。</p></aside></main>
<footer><button id="prev">← 戻る</button><span id="counter"></span><button id="next">送る →</button></footer>
<script src="slides.js?v=20261015d"></script><script src="presenter.js?v=20261015d"></script></body></html>
